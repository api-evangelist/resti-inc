name: Resti Inc.
description: 'Resti Inc. (resti.cloud) is a cloud-based restaurant management platform
  used by restaurant chains, primarily across Kazakhstan and Central Asia. It automates
  HR and payroll (salary calculation from actual hours worked), operational checklists
  and standards with photo verification, review and reputation management aggregating
  2GIS and Yandex Maps, a mobile learning management system (LMS) for staff onboarding
  and training, and AI-assisted invoice processing and reconciliation. Resti integrates
  with restaurant POS and back-office systems including iiko, r_keeper, Paloma 365,
  Poster, and 1C Retail, and is a portfolio company of 500 Global. As of this pass
  it publishes no public developer API, SDKs, OpenAPI, or developer documentation;
  the customer login portal is at my.resti.cloud.'
